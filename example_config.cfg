# Copy to cal_config.cfg and fill in your values. cal_config.cfg is gitignored.
[labmeeting]
googlesheet = Labmeeting_schedule
room = 123
# Virtual meeting link (Zoom, Teams, etc.). 'zoom' still works as a legacy alias.
meeting_link = https://teams.microsoft.com/l/meetup-join/...
email = myemail@example.com
start_time = 09:00:00
end_time = 10:30:00
timezone = America/Chicago
# Service account JSON with Sheets/Drive access (shared on the spreadsheet).
autocreds = serviceaccount.json
schedule_events_count = 16
# Meeting cadence for `labremind generate-schedule`: Data meetings per
# Journal Club, and presenters per Journal Club.
data_per_jc = 3
num_jc_presenters = 2
# Weekly meeting day for `labremind generate-schedule` (default Thursday).
meeting_day = Thursday
# Days ahead that `labremind invite --auto` looks for an event (cron mode).
days_ahead = 7
holiday_vocab = Holiday, holiday, Off, off, Cancel, cancel, Canceled, Cancelled, canceled, cancelled, No meeting, No Meeting, no meeting
# SMTP for sending mail (Gmail app password in .env as EMAIL_USER/EMAIL_PASSWORD).
smtp_server = smtp.gmail.com
smtp_port = 587
# Recipients per email; 1 sends one email to everyone (previous behavior).
# Larger labs on strict institutional servers may need small batches.
batch_size = 1
# BCC mode: address each email to the bot itself so recipients can't see
# each other. Off by default (visible To: header, as before).
bcc = false

[teams]
webhookname = lab_events
webhookUrl = https://my.webhook.office.com/webhookb2/1234
maxevents = 7
# 'workflow' = Power Automate webhook (recommended); 'card' = classic incoming webhook via pymsteams.
mode = workflow
