# Copy to cal_config.cfg and fill in your values. cal_config.cfg is gitignored.
[labmeeting]
googlesheet = Labmeeting_schedule
autocreds = serviceaccount.json

# Default meeting details for blank Schedule cells.
# Individual meetings can override these using the
# Start, End, Timezone, and Location columns.
room = 123
start_time = 09:00:00
end_time = 10:30:00
timezone = America/Chicago

# Virtual meeting link (Zoom, Teams, etc.). 'zoom' still works as a legacy alias.
meeting_link = https://teams.microsoft.com/l/meetup-join/...

# Contact email for scheduling questions.
email = myemail@example.com

# Service account JSON with Sheets/Drive access (shared on the spreadsheet).
schedule_events_count = 16

# Meeting cadence for `labremind generate-schedule`: 
# Data meetings per Journal Club,
# and number of presenters per Journal Club.
data_per_jc = 3
num_jc_presenters = 2

# Weekly meeting day for `labremind generate-schedule` (default Thursday).
meeting_day = Thursday

# Inclusive look-ahead window for 'invite --auto'.
# Manual 'invite' selects the earliest upcoming unsent meeting
# without this date-window restriction.
days_ahead = 7

# Meeting types that indicate no regular lab meeting.
holiday_vocab = Holiday, holiday, Off, off, Cancel, cancel, Canceled, Cancelled, canceled, cancelled, No meeting, No Meeting, no meeting

# SMTP for sending mail (Gmail app password in .env as EMAIL_USER/EMAIL_PASSWORD).
smtp_server = smtp.gmail.com
smtp_port = 587

# Recipients per email; 0 sends one email to everyone, 1 sends one email to each recipient, # N = send in batches of N recipients.
# Larger labs on strict institutional servers may need small positive batches (instead of 0).
batch_size = 0
# Hide recipients from one another by addressing emails
# to the bot and sending to recipients via SMTP.
bcc = false

[teams]
webhookname = lab_events
webhookUrl = https://my.webhook.office.com/webhookb2/1234

# Number of upcoming meetings shown in each Teams notification
maxevents = 7
# 'workflow' = Power Automate webhook (recommended); 'card' = classic incoming webhook via pymsteams.
mode = workflow
